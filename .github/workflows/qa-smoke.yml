name: QA Smoke

# 只跑不依赖真实 LLM 的冒烟子集：
#   - 文件格式解析与入库
#   - 切块参数边界
#   - 重复上传计数
# 用 MockEmbedding 替代 bge-small-zh-v1.5，避免在 runner 上下载 367MB 模型。
# 问答质量、检索准确率这类用例依赖真实语义向量与 DeepSeek，只在本地执行。

on:
  push:
    branches: [main, master]
    paths:
      - "server/**"
      - "tests/**"
      - "requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/qa-smoke.yml"
  pull_request:
    paths:
      - "server/**"
      - "tests/**"
  workflow_dispatch:

concurrency:
  group: qa-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: pytest smoke (mock embedding)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      USE_MOCK_EMBED: "1"      # tests/conftest.py 据此切换 MockEmbedding
      THINKRAG_ENV: development
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pytest allure-pytest

      - name: Run smoke tests
        run: |
          pytest -m "smoke and not llm" -q --tb=short

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results
          if-no-files-found: ignore
