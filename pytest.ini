[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    -p no:cacheprovider
    --alluredir=reports/allure-results
    --clean-alluredir

markers =
    smoke: 冒烟用例，不调用真实 LLM，CI 默认执行
    llm: 需要调用真实 LLM（DeepSeek）的用例，CI 不执行
    retrieval: 依赖真实语义检索质量的用例，MockEmbedding 下无意义
    slow: 耗时较长的用例，默认跳过

# 中文输出，避免 Windows 控制台乱码
filterwarnings =
    ignore::DeprecationWarning
